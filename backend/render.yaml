services:
  - type: web
    name: study-ai-agent-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: EMBED_PROVIDER
        value: fastembed
      - key: FAST_EMBED_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: GROQ_API_KEY
        sync: false
      - key: STUDYAI_AUTH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
